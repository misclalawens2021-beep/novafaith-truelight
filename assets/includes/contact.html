<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | NovaFaith</title>
    <link rel="icon" href="/assets/img/truelight_logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/assets/css/style.css?v=20261203">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Saira:wght@300;600&family=Noto+Sans+Khmer:wght@400;700&display=swap">
</head>
<body class="sub-page">

    <div class="progress-container">
        <div class="progress-bar" id="myBar"></div>
    </div>

    <!-- Header commun : assets/includes/header.html -->
    <div data-include="/assets/includes/header.html"></div>

    <main>
        <div class="contact-row">
        <section class="contact-section" id="contact-section">
            <div class="contact-container">
                <div class="contact-header">
                    <h2 data-i18n="contact.title">CONTACT ME </h2>
                    <div class="separator"></div>
                    <p data-i18n="contact.sub">Any question about collection or your faith ? Send us a message !</p>
                </div>

                <form id="contact-form" action="https://formspree.io/f/myeeezng" method="POST" novalidate>
                    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="name" name="name" placeholder="Your Name" data-i18n-ph="ph.name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" id="email" name="email" placeholder="Your Email" data-i18n-ph="ph.email2" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" rows="5" placeholder="How can we help you?" data-i18n-ph="ph.msg" required></textarea>
                    </div>
                    <button type="submit" class="lm" data-i18n="contact.send">SEND MESSAGE</button>
                </form>
                <div id="form-status"></div>
            </div>
        </section>

        <!-- Réseaux sociaux -->
        <div class="rs-links" id="mysocialmedia">
            <h2 data-i18n="contact.social">My social media</h2>

            <div class="rs-container">
                <a class="rs-btn" href="https://www.instagram.com/novafaith.official/" target="_blank" rel="noopener" aria-label="Instagram">
                    <!-- <img src="/assets/img/instagram-colored.png" style="width: 50px; height: 50px;" alt="Instagram"> -->
                    <i class="bi bi-instagram" style="color:#ffffff; font-size: 40px;"></i>
                </a>

                <a class="rs-btn" href="https://www.tiktok.com/@novafaith.official" target="_blank" rel="noopener" aria-label="TikTok">
                    <!-- <img src="/assets/img/tiktok-svgrepo-com.svg" style="width: 50px; height: 50px;" alt="TikTok"> -->
                    <i class="bi bi-tiktok" style="color: #ffffff; font-size: 40px;"></i>
                </a>

                <!-- <a class="rs-btn" href="mailto:novafaith.official@gmail.com" aria-label="Email"><img src="/assets/img/mail-pencil-svgrepo-com.svg" style="width: 50px; height: 50px;" alt="Email"></a> -->
            </div>
        </div>
        </div><!-- /contact-row -->
    </main>

    <div data-include="/assets/includes/footer.html"></div>

    <button id="backToTop" class="back-to-top" title="Back to top" data-i18n-title="ui.top">
        <img src="/assets/img/chevron_left_60dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg" alt="Top">
    </button>

    <script src="/assets/js/common.js?v=20261203"></script>
    <script src="/assets/js/script.js?v=20261203"></script>
</body>
</html>
