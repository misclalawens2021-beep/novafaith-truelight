<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | NovaFaith</title>
    <link rel="icon" href="/assets/img/truelight_logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/assets/css/style.css?v=20261203">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Saira:wght@300;600&family=Noto+Sans+Khmer:wght@400;700&display=swap">
</head>
<body class="checkout-page auth-page">

    <!-- Header commun : assets/includes/header.html -->
    <div data-include="/assets/includes/header.html"></div>

    <main>
        <h1 class="checkout-title" data-i18n="nav.account">Account</h1>

        <div class="auth-layout">
            <!-- Image : remplace novafaith_1.jpg par celle de ton choix (dans /assets/img/) -->
            <figure class="auth-image">
                <img src="/assets/img/truelight_logo.jpg" alt="NovaFaith">
            </figure>

            <div class="auth-panel">

        <!-- Utilisateur déjà connecté -->
        <section class="co-block" id="auth-logged" hidden>
            <h2 id="auth-welcome"></h2>
            <p class="co-note" id="auth-email"></p>
            <div class="auth-actions">
                <a href="/assets/includes/orders.html" class="lm" data-i18n="nav.orders">My orders</a>
                <a href="/assets/includes/collection.html" class="lm" data-i18n="nav.continue">Continue shopping</a>
                <button type="button" class="lm" id="logout-btn" data-i18n="auth.btnLogout">LOG OUT</button>
            </div>
        </section>

        <!-- Connexion / création de compte -->
        <div id="auth-forms">
            <div class="auth-tabs" role="tablist">
                <button type="button" id="tab-login" class="active" role="tab" aria-selected="true" data-i18n="auth.login">Log in</button>
                <button type="button" id="tab-register" role="tab" aria-selected="false" data-i18n="auth.create">Create account</button>
            </div>

            <form id="login-form" class="checkout-form auth-form co-block" novalidate>
                <h2 data-i18n="auth.login">Log in</h2>
                <input type="email" id="login-email" placeholder="Email" data-i18n-ph="ph.email" autocomplete="email" required>
                <input type="password" id="login-password" placeholder="Password" data-i18n-ph="ph.pw" autocomplete="current-password" data-pw required>
                <label class="auth-show"><input type="checkbox" class="show-pw"> <span data-i18n="auth.showpw">Show password</span></label>
                <div class="co-error" id="login-error" role="alert"></div>
                <button type="submit" class="lm" data-i18n="auth.btnLogin">LOG IN</button>
            </form>

            <form id="register-form" class="checkout-form auth-form co-block" novalidate hidden>
                <h2 data-i18n="auth.createTitle">Create your account</h2>
                <input type="text" id="reg-name" placeholder="Full name" data-i18n-ph="ph.fullname" autocomplete="name" required>
                <input type="email" id="reg-email" placeholder="Email" data-i18n-ph="ph.email" autocomplete="email" required>
                <input type="password" id="reg-password" placeholder="Password" data-i18n-ph="ph.pw" autocomplete="new-password" data-pw required>
                <input type="password" id="reg-confirm" placeholder="Confirm password" data-i18n-ph="ph.confirm" autocomplete="new-password" data-pw required>
                <label class="auth-show"><input type="checkbox" class="show-pw"> <span data-i18n="auth.showpws">Show passwords</span></label>
                <p class="co-note" data-i18n="auth.rules">At least 8 characters, with a letter and a number.</p>
                <div class="co-error" id="register-error" role="alert"></div>
                <button type="submit" class="lm" data-i18n="auth.btnCreate">CREATE ACCOUNT</button>
            </form>

            <div class="auth-divider"><span data-i18n="auth.or">or</span></div>
            <div class="auth-social">
                <button type="button" class="social-btn" id="google-btn"><i class="bi bi-google"></i> <span data-i18n="auth.google">Continue with Google</span></button>
                <div class="co-error" id="social-error" role="alert"></div>
            </div>

            <p class="co-note auth-demo" data-i18n="auth.demo">Demo: accounts are stored in this browser only. Passwords are never saved in clear text.</p>
        </div>

            </div><!-- /auth-panel -->
        </div><!-- /auth-layout -->
    </main>

    <div data-include="/assets/includes/footer.html"></div>
    <script src="/assets/js/common.js?v=20261203"></script>
    <script src="/assets/js/config.js?v=20261203"></script>
    <script src="/assets/js/auth.js?v=20261203"></script>
    <script src="/assets/js/script.js?v=20261203"></script>
</body>
</html>
